name: Deploy to Coolify

# Auto-deploys BOTH apps to Coolify on every push to main: the Next.js frontend and the FastAPI
# backend (backend/, Dockerfile build). Use this INSTEAD of Coolify's built-in git-push webhook:
# that webhook is fire-once, so a transient 502 (Coolify briefly unreachable while a build is
# running) silently drops the deploy with no retry. This workflow calls Coolify's deploy API with
# retries + backoff and turns a red run (with email) when it can't reach Coolify at all.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   COOLIFY_API_TOKEN         - a Coolify API token with deploy permission
#   COOLIFY_APP_UUID          - the frontend APPLICATION uuid (Coolify app URL /application/<uuid>)
#   COOLIFY_BACKEND_APP_UUID  - the backend APPLICATION uuid

env:
  COOLIFY_URL: https://coolify.zeeshanai.cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual re-trigger from the Actions tab

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failing backend deploy must not stop the frontend one (and vice versa)
      matrix:
        app: [backend, frontend]
    steps:
      - name: Trigger Coolify deploy for ${{ matrix.app }} (with retries)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ matrix.app == 'backend' && secrets.COOLIFY_BACKEND_APP_UUID || secrets.COOLIFY_APP_UUID }}
        run: |
          set -u
          for i in 1 2 3 4 5; do
            code=$(curl -sS -X POST -o /dev/null -w "%{http_code}" --max-time 90 \
              "${COOLIFY_URL}/api/v1/deploy?uuid=${APP_UUID}&force=false" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Deploy queued successfully."
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              backoff=$((i * 15)) # 15s, 30s, 45s, 60s
              echo "Retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done
          echo "::error::All 5 attempts to trigger the Coolify deploy for ${{ matrix.app }} failed."
          exit 1
