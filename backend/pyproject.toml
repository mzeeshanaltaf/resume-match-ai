[project]
name = "resumatch-backend"
version = "0.1.0"
description = "ResuMatchAI FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aioboto3>=13.2",
    "openai>=3.49",
    "httpx>=0.27",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# Application, not a library: no build backend / installable package needed.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:aioboto3.*",
    "ignore::DeprecationWarning:botocore.*",
]
