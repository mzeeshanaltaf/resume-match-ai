# Local development Postgres (NOT the shared production database).
#   docker compose -f docker-compose.dev.yml up -d
# Creates two databases: resumatch_dev (running the app) and resumatch_test (pytest).
services:
  postgres:
    image: postgres:17
    container_name: resumatch-dev-postgres
    environment:
      POSTGRES_USER: resumatch
      POSTGRES_PASSWORD: resumatch
      POSTGRES_DB: resumatch_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - resumatch_dev_pgdata:/var/lib/postgresql/data
      - ./dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumatch -d resumatch_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  resumatch_dev_pgdata:
